name: PostgreSQL smoke test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL startup and query
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - name: Generate ephemeral database credentials
        run: echo "POSTGRES_PASSWORD=$(openssl rand -hex 24)" >> "$GITHUB_ENV"
      - name: Start PostgreSQL and run an authenticated query
        run: |
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 90 db
          result=$(docker compose exec -T db sh -ec '
            PGPASSWORD="$POSTGRES_PASSWORD" psql -h 127.0.0.1               -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 -Atc "SELECT 1;"
          ')
          test "$result" = 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Apply migrations and run the pipeline tests
        env:
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: "5433"
          POSTGRES_USER: warehouse
          POSTGRES_DB: warehouse
        run: |
          python -m pipeline.migrate
          python -m pytest -ra
      - name: Show server logs on failure
        if: failure()
        run: docker compose logs db
      - name: Clean up
        if: always()
        run: docker compose down --volumes

  tests:
    name: Ruff and PostgreSQL integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: warehouse
          POSTGRES_DB: warehouse
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U warehouse -d warehouse"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      CI: "true"
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      POSTGRES_USER: warehouse
      POSTGRES_DB: warehouse
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and quality tools
        run: python -m pip install -e '.[dev]'
      - name: Lint
        run: ruff check src tests
      - name: Apply migrations and run the test suite
        run: |
          python -m pipeline.migrate
          python -m pytest -ra
