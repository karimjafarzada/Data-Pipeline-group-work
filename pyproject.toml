[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pipeline"
version = "0.1.0"
description = "Chicago crimes data pipeline: Socrata API to PostgreSQL bronze/silver/gold"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "pydantic>=2.9",
    "requests>=2.32",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "responses>=0.25",
    "ruff==0.17.6",
    "pre-commit>=4,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: needs a real PostgreSQL server (set POSTGRES_HOST, POSTGRES_USER, POSTGRES_DB)",
]
