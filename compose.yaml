services:
  db:
    image: postgres:16-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  pipeline: &pipeline
    build: .
    profiles: [tools]
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      POSTGRES_DB: ${POSTGRES_DB:-warehouse}
      POSTGRES_USER: ${POSTGRES_USER:-warehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      API_BASE_URL: ${API_BASE_URL:-https://data.cityofchicago.org}
      SOCRATA_APP_TOKEN: ${SOCRATA_APP_TOKEN:-}
      QUALITY_MAX_FAILURE_RATE: ${QUALITY_MAX_FAILURE_RATE:-0.05}
      API_INCREMENTAL_TIMEOUT_SECONDS: ${API_INCREMENTAL_TIMEOUT_SECONDS:-120}
      SCHEDULE_INTERVAL_SECONDS: ${SCHEDULE_INTERVAL_SECONDS:-86400}
    depends_on:
      db:
        condition: service_healthy

  scheduler:
    <<: *pipeline
    profiles: [scheduled]
    command: ["python", "-m", "pipeline.scheduler"]
    restart: unless-stopped

volumes:
  postgres_data:
